# Sayt GitHub Pages'da: har push'da va har kuni 07:40 (Toshkent) da narxlar yangilanib, sayt qayta joylanadi.
name: Sayt va narxlar
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Narxlar, rasmlar va mehmonxona sahifalarini yangilash
        if: github.event_name != 'push'
        run: |
          pip install pillow
          node snapshot.mjs public/packages.json
          python3 photopack.py public/packages.json public/photos.json 350 || true
          python3 hotelpack.py public/packages.json public/hotels 230 || true
          git config user.name "vella-bot"
          git config user.email "vella-bot@users.noreply.github.com"
          git add public/packages.json public/photos.json public/hotels || true
          git commit -m "Narxlar yangilandi" || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
