# Render bepul serveri uxlab qolmasligi uchun har 10 daqiqada /api/ping (uxlagan bo'lsa uyg'otadi)
name: Bot uyg'oq tursin
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 120 --retry 3 --retry-delay 10 https://vella-tour.onrender.com/api/ping || true
