<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyurtma holati — Vella Tour</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;700;800&display=swap">
<style>
:root{--bg:#F1F6F6;--surface:#fff;--fg:#13292F;--muted:#5B7378;--line:#D8E4E5;--ink:#0C3640;--accent:#FF6A3D;--good:#1D8558}
@media (prefers-color-scheme:dark){:root{--bg:#0A1A1E;--surface:#11262B;--fg:#E3EEEF;--muted:#8EA7AC;--line:#22404A;--ink:#06151A;--accent:#FF7A50;--good:#45C08A;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Manrope,system-ui,sans-serif}
header{background:var(--ink);color:#F2FAFA;padding:16px max(16px,env(safe-area-inset-left))}
header a{color:inherit;text-decoration:none;font:700 18px Unbounded,system-ui}
main{max-width:640px;margin:24px auto;padding:0 16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font:700 22px Unbounded,system-ui;margin:0}
.muted{color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--muted)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px}
.steps li.done{color:var(--fg)}.steps li.done i{background:var(--good);border-color:var(--good);color:#fff}
.steps li.now{color:var(--fg)}.steps li.now i{border-color:var(--accent)}
.docs a{display:block;padding:12px 14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;margin-top:8px}
.bad{color:#D2382B;font-weight:800}
</style>
</head>
<body>
<header><a href="/">Vella Tour</a></header>
<main id="m"><div class="card muted">Yuklanmoqda…</div></main>
<script>
const id=new URLSearchParams(location.search).get("id");
const STEPS=[["new","To‘lov kutilmoqda"],["paid","To‘lov qabul qilindi"],["booking","Bron qilinmoqda"],["booked","Bron tasdiqlandi"],["docs","Chipta va vaucher tayyor"]];
const fmt=n=>new Intl.NumberFormat("ru-RU").format(n);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
  try{
    const r=await fetch("/api/order?id="+encodeURIComponent(id||""));
    if(!r.ok) throw 0;
    const o=await r.json(), idx=STEPS.findIndex(s=>s[0]===o.status);
    document.getElementById("m").innerHTML=`
    <div class="card"><h1>Buyurtma #${esc(o.id)}</h1>
      <p class="muted" style="margin:6px 0 0">${esc(o.pkg.hotel)} · ${esc(o.pkg.region)}<br>Uchish: ${esc(o.pkg.date)} · ${o.pkg.nights} kecha · ${o.tourists} kishi<br>Summa: <b>${fmt(o.amountUzs)} so‘m</b></p></div>
    <div class="card">${o.status==="cancelled"?'<p class="bad" style="margin:0">Buyurtma bekor qilingan. Savollar bo‘lsa, menejerimizga yozing.</p>':
      `<ul class="steps">${STEPS.map((s,i)=>`<li class="${i<idx||o.status==="docs"&&i===idx?"done":i===idx?"now":""}"><i>${i<idx||o.status==="docs"?"✓":i+1}</i>${s[1]}</li>`).join("")}</ul>`}</div>
    ${o.docs&&o.docs.length?`<div class="card docs"><b>Hujjatlaringiz</b>${o.docs.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)} ↓</a>`).join("")}</div>`:""}`;
    if(!["docs","cancelled"].includes(o.status)) setTimeout(load,20000);
  }catch(_){document.getElementById("m").innerHTML='<div class="card bad">Buyurtma topilmadi.</div>'}
}
load();
</script>
</body>
</html>
